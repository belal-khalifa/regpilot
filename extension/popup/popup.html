<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 280px;
        font-family: -apple-system, system-ui, sans-serif;
        background: #ffffff;
        color: #1d1d1f;
      }
      header {
        background: #000000;
        color: #ffffff;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
      }
      main {
        padding: 16px;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #0066cc;
        margin: 0 0 6px;
      }
      .status {
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 14px;
        color: #333333;
      }
      button {
        width: 100%;
        font-family: inherit;
        font-size: 13px;
        border-radius: 9999px;
        padding: 9px 14px;
        border: 1px solid #e0e0e0;
        background: #fff;
        color: #1d1d1f;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>RegPilot</header>
    <main>
      <p class="eyebrow">Queued for Montaji</p>
      <p class="status" id="status">Checking…</p>
      <button id="clear-btn" disabled>Clear queued data</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
